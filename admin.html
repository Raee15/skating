<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin</title>
<style>
  :root { --bg:#E4F1FA; --card:#fff; --ink:#17324D; --muted:#5F7A93; --accent:#2F7FD1; --line:#B9D6EC; --chip:#EEF6FC; }
  * { box-sizing: border-box; }
  body { font-family: "Trebuchet MS", Arial, sans-serif; margin:0; min-height:100vh; background:var(--bg); color:var(--ink); padding:16px; }
  main { max-width: 820px; margin: 0 auto; }
  .card { background:var(--card); border:2px solid var(--line); border-radius:16px; padding:20px; margin-bottom:16px; box-shadow:0 6px 16px rgba(23,50,77,.12); }
  h1 { margin:0 0 4px; font-size:26px; }
  p { color:var(--muted); margin:0 0 12px; }
  input, button { font:inherit; font-size:16px; }
  input { display:block; padding:10px; margin-bottom:10px; border:2px solid var(--line); border-radius:10px; width:min(320px,100%); }
  button { background:var(--accent); color:#fff; border:none; border-radius:10px; padding:11px 18px; cursor:pointer; }
  button.ghost { background:var(--chip); color:var(--ink); border:2px solid var(--line); }
  button:focus-visible, input:focus-visible { outline:3px solid var(--ink); outline-offset:2px; }
  .hidden { display:none !important; }
  #err { color:#B3261E; margin-top:10px; min-height:1.3em; }
  .banner { background:#FFF4CC; border:2px solid #E8D27A; border-radius:12px; padding:10px 14px; margin-bottom:16px; }
  .counts { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 0; }
  .counts span { background:var(--chip); border:2px solid var(--line); border-radius:10px; padding:6px 10px; font-size:14px; }
  .scroll { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; min-width:560px; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:14px; }
  .row-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
</style>
</head>
<body>
<main>
  <div id="testBanner" class="banner hidden">Test mode: showing replies saved in this browser only. Fill in the Firebase settings in both files to use real data.</div>

  <section id="login" class="card">
    <h1>Admin</h1>
    <p>Sign in to see the replies.</p>
    <input type="email" id="email" placeholder="Admin email" autocomplete="username">
    <input type="password" id="password" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn">Sign in</button>
    <div id="err" role="alert"></div>
  </section>

  <section id="panel" class="card hidden">
    <h1>Replies</h1>
    <p id="total"></p>
    <div class="counts" id="counts"></div>
    <div class="scroll" style="margin-top:14px">
      <table>
        <thead><tr><th>Name</th><th>Day</th><th>Time</th><th>Others</th><th>Sent</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="empty" class="hidden" style="margin-top:12px">No replies yet. Share the invite link and check back.</div>
    <div class="row-actions">
      <button id="refreshBtn">Refresh</button>
      <button id="logoutBtn" class="ghost">Sign out</button>
    </div>
  </section>
</main>

<script>
  // Must match invite.html. Leave DB_URL empty for TEST MODE.
  var DB_URL  = '';   // https://YOUR-PROJECT-default-rtdb.REGION.firebasedatabase.app
  var API_KEY = '';   // Firebase project settings > Web API key

  var $ = function (id) { return document.getElementById(id); };
  var DAY_ORDER = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  var idToken = '';

  if (!DB_URL) $('testBanner').classList.remove('hidden');

  function timeValue(t) {
    var m = /(\d+):(\d+)\s*(AM|PM)/i.exec(t || '');
    if (!m) return 0;
    return (+m[1] % 12 + (m[3].toUpperCase() === 'PM' ? 12 : 0)) * 60 + +m[2];
  }

  function signIn(email, password) {
    return fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=' + encodeURIComponent(API_KEY), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: password, returnSecureToken: true })
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (d.error) throw new Error('login');
      idToken = d.idToken;
    });
  }

  function fetchRows() {
    if (!DB_URL) {
      var local = [];
      try { local = JSON.parse(localStorage.getItem('invite_responses') || '[]'); } catch (e) {}
      return Promise.resolve(local);
    }
    return fetch(DB_URL + '/responses.json?auth=' + encodeURIComponent(idToken))
      .then(function (r) { if (!r.ok) throw new Error('load'); return r.json(); })
      .then(function (obj) { return obj ? Object.keys(obj).map(function (k) { return obj[k]; }) : []; });
  }

  function render(rows) {
    rows.sort(function (a, b) {
      return DAY_ORDER.indexOf(a.day) - DAY_ORDER.indexOf(b.day) || timeValue(a.time) - timeValue(b.time);
    });
    $('total').textContent = rows.length + (rows.length === 1 ? ' reply' : ' replies');

    var counts = {};
    rows.forEach(function (r) { counts[r.day] = (counts[r.day] || 0) + 1; });
    $('counts').innerHTML = '';
    DAY_ORDER.forEach(function (d) {
      if (!counts[d]) return;
      var s = document.createElement('span');
      s.textContent = d.slice(0, 3) + ': ' + counts[d];
      $('counts').appendChild(s);
    });

    var body = $('rows');
    body.innerHTML = '';
    rows.forEach(function (r) {
      var tr = document.createElement('tr');
      var others = r.bringing ? (r.count || '?') + (r.names ? ' (' + r.names + ')' : '') : 'Just us';
      var sent = r.submitted ? new Date(r.submitted).toLocaleString() : '';
      [r.name || '(no name)', r.day + ', ' + r.date, r.time, others, sent].forEach(function (v) {
        var td = document.createElement('td');
        td.textContent = v;   // textContent: never trust what invitees type
        tr.appendChild(td);
      });
      body.appendChild(tr);
    });
    $('empty').classList.toggle('hidden', rows.length > 0);
  }

  function showPanel() {
    return fetchRows().then(function (rows) {
      $('login').classList.add('hidden');
      $('panel').classList.remove('hidden');
      render(rows);
    });
  }

  function login() {
    $('err').textContent = '';
    var p = DB_URL ? signIn($('email').value.trim(), $('password').value) : Promise.resolve();
    p.then(showPanel).catch(function (e) {
      $('err').textContent = e.message === 'login'
        ? 'Wrong email or password.'
        : 'Could not load replies. Check your Firebase settings and rules.';
    });
  }

  $('loginBtn').addEventListener('click', login);
  $('password').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
  $('refreshBtn').addEventListener('click', function () {
    showPanel().catch(function () { $('err').textContent = 'Could not refresh. Sign in again.'; });
  });
  $('logoutBtn').addEventListener('click', function () {
    idToken = ''; $('password').value = '';
    $('panel').classList.add('hidden');
    $('login').classList.remove('hidden');
  });
</script>
</body>
</html>
